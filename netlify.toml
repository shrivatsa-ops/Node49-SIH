[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/mandi-prices"
  to = "/.netlify/functions/mandi-prices"
  status = 200

[[redirects]]
  from = "/api/crop-analysis"
  to = "/.netlify/functions/crop-analysis"
  status = 200
